[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# The package is installed as "kiroku-cli" because "kiroku" is already taken
# on PyPI by an unrelated, inactive project. The command stays "kiroku".
name = "kiroku-cli"
version = "0.6.0"
description = "Your commits, on record. Turn git commits into readable release notes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kiroku" }]
keywords = ["changelog", "git", "release-notes", "conventional-commits"]
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
kiroku = "kiroku.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["kiroku*"]
